            <button class="quick-chip px-2.5 py-1 rounded-lg bg-slate-800/80 text-slate-300 hover:text-cyan-400 hover:bg-slate-700/80 border border-slate-700 transition" data-from="Kadıköy Rıhtım / Meydan" data-to="Beşiktaş İskele">Kadıköy ➔ Beşiktaş</button>

    <!-- Map Canvas View -->
    <main class="flex-1 h-full relative" role="region" aria-label="Harita Görünümü">
      <div id="map"></div>
      
      <!-- Live Map Toast Notification -->
      <div id="mapToast" class="absolute bottom-5 right-5 bg-slate-900/90 backdrop-blur-md border border-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded-xl shadow-2xl z-20 hidden flex items-center gap-2">
        <span class="pulse-dot bg-emerald-400"></span>
        <span id="mapToastText">Pini sürükleyerek rotayı güncelleyebilirsiniz.</span>
      </div>

  <script>
    let map;
    let fromMarker = null, toMarker = null;
    let activeRouteLayers = [];
    let busMarkers = [];
    let selectedFrom = null; // { lat, lon, name }
    let selectedTo = null;   // { lat, lon, name }
    let preferredModes = new Set();
    let currentTarget = 'FASTEST';
    let currentTimeType = 'DEPART_NOW';
    let searchDebounceTimer = null;

    // Polyline Decoder for Google Encoded Polylines
    function decodePolyline(str, precision) {
      let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null, latitude_change, longitude_change, factor = Math.pow(10, precision || 5);
      while (index < str.length) {
        byte = null; shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        latitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));
        shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        longitude_change = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lat += latitude_change; lng += longitude_change;
        coordinates.push([lat / factor, lng / factor]);
      }
      return coordinates;
    }

    // Official Istanbul Transit Color & Mode Theme Matcher
    function getTransitTheme(leg) {
      const mode = (leg.mode || '').toUpperCase();
      const route = (leg.route_short_name || leg.route_long_name || '').toUpperCase();

      if (mode === 'WALK') {
        return { color: '#64748b', bgClass: 'bg-slate-700', icon: '🚶', name: 'Yürüme', isWalk: true };
      }
      if (mode === 'FERRY' || route.includes('VAPUR') || route.includes('KADIKOY-BESIKTAS') || route.includes('USKUDAR') || route.includes('BOSTANCI')) {
        return { color: '#0284c7', bgClass: 'bg-sky-600', icon: '🚢', name: 'Vapur' };
      }
      if (route.includes('M11')) {
        return { color: '#9e1b32', bgClass: 'bg-rose-900', icon: '🚇', name: 'M11 Metro' };
      }
      if (route.includes('M2')) {
        return { color: '#00965e', bgClass: 'bg-emerald-600', icon: '🚇', name: 'M2 Metro' };
      }
      if (route.includes('M7')) {
        return { color: '#a52a2a', bgClass: 'bg-amber-900', icon: '🚇', name: 'M7 Metro' };
      }
      if (route.includes('MARMARAY') || mode === 'RAIL') {
        return { color: '#008080', bgClass: 'bg-teal-700', icon: '🚆', name: 'Marmaray' };
      }
      if (route.includes('34') || route.includes('METROB') || mode === 'METROBUS') {
        return { color: '#e60000', bgClass: 'bg-red-600', icon: '🚎', name: 'Metrobüs' };
      }
      if (route.startsWith('T') || mode === 'TRAM') {
        return { color: '#8b5cf6', bgClass: 'bg-purple-600', icon: '🚊', name: 'Tramvay' };
      }
      if (mode === 'SUBWAY') {
        return { color: '#00965e', bgClass: 'bg-emerald-600', icon: '🚇', name: 'Metro' };
      }
      return { color: '#d97706', bgClass: 'bg-amber-600', icon: '🚌', name: 'İETT Otobüs' };
    }

    // Multi-source Resilient Tile Initialization
    function initMap() {
      if (typeof L === 'undefined') {
        alert("Harita kütüphanesi yüklenemedi. Lütfen sayfayı yenileyin.");
        return;
      }

      map = L.map('map', { 
        zoomControl: false,
        attributionControl: false 
      }).setView([41.025, 29.015], 12);

      L.control.zoom({ position: 'topright' }).addTo(map);
      L.control.attribution({ position: 'bottomright' }).addTo(map);

      // 1. Ultra-clean Esri World Light Gray Canvas (Default: Zero yellow clutter, crystal-clear labels)
      const esriCanvasLight = L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 16,
          attribution: 'Tiles &copy; Esri &mdash; Light Canvas'
        }),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 16
        })
      ]);

      // 2. Esri World Dark Gray Canvas (Night navigation mode)
      const esriCanvasDark = L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 16,
          attribution: 'Tiles &copy; Esri &mdash; Dark Canvas'
        }),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 16
        })
      ]);

      // 3. Esri World Street Map (Detailed street-level view)
      const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri &mdash; World Street'
      });

      // 4. Clean Grayscale OpenStreetMap (Normalized fallback)
      const osmClean = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        className: 'osm-clean-tiles',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
      });

      // Add default tile layer
      esriCanvasLight.addTo(map);

      // Layer Switcher in Top Right
      L.control.layers({
        "🏙️ Açık & Sade (Canvas)": esriCanvasLight,
        "🌙 Gece Modu (Dark)": esriCanvasDark,
        "🗺️ Sokak Detayı (Street)": esriStreet,
        "🌐 Standart OSM (Sade)": osmClean
      }, null, { position: 'topright', collapsed: true }).addTo(map);

      // Invalidate map size on window resize
      window.addEventListener('resize', () => {
        if (map) map.invalidateSize();
      });

      // Interactive Map Click Context Menu
      map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        const popupContent = document.createElement('div');
        popupContent.className = 'space-y-2 p-1 text-xs';
        popupContent.innerHTML = `
          <div class="font-bold text-slate-100 flex items-center gap-1.5">
            <span>📍</span> Seçilen Koordinat
          </div>
          <p class="text-[11px] text-slate-400">${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
          <div class="flex gap-2 pt-1">
            <button id="setOriginBtn" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[11px] font-bold shadow transition">🟢 Başlangıç</button>
            <button id="setDestBtn" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-[11px] font-bold shadow transition">🔴 Varış</button>
          </div>
        `;

        const popup = L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);

        setTimeout(() => {
          const originBtn = document.getElementById('setOriginBtn');
          const destBtn = document.getElementById('setDestBtn');
          if (originBtn) {
            originBtn.addEventListener('click', () => {
              selectOrigin(lat, lon, `Haritadan Seçilen Nokta (${lat.toFixed(3)}, ${lon.toFixed(3)})`);
              map.closePopup();
            });
          }
          if (destBtn) {
            destBtn.addEventListener('click', () => {
              selectDestination(lat, lon, `Haritadan Seçilen Nokta (${lat.toFixed(3)}, ${lon.toFixed(3)})`);
              map.closePopup();
            });
          }
        }, 50);
      });
    }

    // Origin Selection with Draggable Retina Pin
    function selectOrigin(lat, lon, name) {
      selectedFrom = { lat, lon, name };
      document.getElementById('fromInput').value = name;
      document.getElementById('clearFromBtn').classList.remove('hidden');

      if (fromMarker) map.removeLayer(fromMarker);
      fromMarker = L.marker([lat, lon], {
        draggable: true,
        icon: L.divIcon({
          className: 'origin-pin-container',
          html: '<div class="origin-pin"></div>',
          iconSize: [24, 24],
          iconAnchor: [12, 24],
          popupAnchor: [0, -24]
        })
      }).addTo(map).bindPopup(`
        <div class="text-xs font-semibold text-emerald-400">🟢 Başlangıç Noktası</div>
        <div class="text-[11px] text-slate-200 mt-0.5">${name}</div>
        <div class="text-[9px] text-slate-400 mt-1 italic">Konumu değiştirmek için pini sürükleyebilirsiniz.</div>
      `);

      fromMarker.on('dragend', function(e) {
        const p = e.target.getLatLng();
        selectedFrom = { lat: p.lat, lon: p.lng, name: `Taşınan Başlangıç (${p.lat.toFixed(3)}, ${p.lng.toFixed(3)})` };
        document.getElementById('fromInput').value = selectedFrom.name;
        if (selectedTo) executeRouteSearch();
      });

      map.panTo([lat, lon]);

      if (!selectedTo) {
        setTimeout(() => document.getElementById('toInput').focus(), 150);
      } else {
        setTimeout(() => executeRouteSearch(), 200);
      }
    }

    // Destination Selection with Draggable Retina Pin
    function selectDestination(lat, lon, name) {
      selectedTo = { lat, lon, name };
      document.getElementById('toInput').value = name;
      document.getElementById('clearToBtn').classList.remove('hidden');

      if (toMarker) map.removeLayer(toMarker);
      toMarker = L.marker([lat, lon], {
        draggable: true,
        icon: L.divIcon({
          className: 'dest-pin-container',
          html: '<div class="dest-pin"></div>',
          iconSize: [24, 24],
          iconAnchor: [12, 24],
          popupAnchor: [0, -24]
        })
      }).addTo(map).bindPopup(`
        <div class="text-xs font-semibold text-rose-400">🔴 Varış Noktası</div>
        <div class="text-[11px] text-slate-200 mt-0.5">${name}</div>
        <div class="text-[9px] text-slate-400 mt-1 italic">Konumu değiştirmek için pini sürükleyebilirsiniz.</div>
      `);

      toMarker.on('dragend', function(e) {
        const p = e.target.getLatLng();
        selectedTo = { lat: p.lat, lon: p.lng, name: `Taşınan Varış (${p.lat.toFixed(3)}, ${p.lng.toFixed(3)})` };
        document.getElementById('toInput').value = selectedTo.name;
        if (selectedFrom) executeRouteSearch();
      });

      if (selectedFrom) {
        setTimeout(() => executeRouteSearch(), 200);
      }
    }

    function clearOrigin() {
      selectedFrom = null;
      document.getElementById('fromInput').value = '';
      document.getElementById('clearFromBtn').classList.add('hidden');
      if (fromMarker) map.removeLayer(fromMarker);
      fromMarker = null;
      clearRouteMap();
    }

    function clearDestination() {
      selectedTo = null;
      document.getElementById('toInput').value = '';
      document.getElementById('clearToBtn').classList.add('hidden');
      if (toMarker) map.removeLayer(toMarker);
      toMarker = null;
      clearRouteMap();
    }

    function clearRouteMap() {
      activeRouteLayers.forEach(l => map.removeLayer(l));
      activeRouteLayers = [];
      busMarkers.forEach(b => map.removeLayer(b));
      busMarkers = [];
    }

    // Autocomplete Handler with Arrow Key & Enter Support
    function setupAutocomplete(inputId, dropdownId, onSelect) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      let focusedIndex = -1;

      input.addEventListener('input', () => {
        clearTimeout(searchDebounceTimer);
        const q = input.value.trim();
        if (q.length < 2) {
          dropdown.classList.add('hidden');
          dropdown.innerHTML = '';
          return;
        }

        searchDebounceTimer = setTimeout(async () => {
          try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            focusedIndex = -1;
            renderDropdown(dropdown, data.results || [], onSelect);
          } catch (e) {
            console.error("Arama hatası:", e);
          }
        }, 180);
      });

      input.addEventListener('keydown', (e) => {
        const options = dropdown.querySelectorAll('.dropdown-option');
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (options.length > 0) {
            focusedIndex = (focusedIndex + 1) % options.length;
            highlightOption(options, focusedIndex);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (options.length > 0) {
            focusedIndex = (focusedIndex - 1 + options.length) % options.length;
            highlightOption(options, focusedIndex);
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (focusedIndex >= 0 && options[focusedIndex]) {
            options[focusedIndex].click();
          } else if (options.length > 0 && !dropdown.classList.contains('hidden')) {
            options[0].click();
          } else if (selectedFrom && selectedTo) {
            executeRouteSearch();
          }
        } else if (e.key === 'Escape') {
          dropdown.classList.add('hidden');
        }
      });

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      });
    }

    function highlightOption(options, idx) {
      options.forEach((opt, i) => {
        if (i === idx) {
          opt.classList.add('bg-slate-700/80');
          opt.scrollIntoView({ block: 'nearest' });
        } else {
          opt.classList.remove('bg-slate-700/80');
        }
      });
    }

    function renderDropdown(dropdown, items, onSelect) {
      dropdown.innerHTML = '';
      if (items.length === 0) {
        dropdown.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Eşleşen durak veya mekan bulunamadı</div>';
        dropdown.classList.remove('hidden');
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = "dropdown-option p-2.5 hover:bg-slate-800 flex items-center gap-3 cursor-pointer transition";
        row.innerHTML = `
          <span class="text-base shrink-0 p-1.5 rounded-lg bg-slate-800/80 border border-slate-700/50">${item.icon}</span>
          <div class="min-w-0 flex-1">
            <p class="text-xs sm:text-sm font-semibold text-slate-100 truncate">${item.title}</p>
            <p class="text-[11px] text-slate-400 truncate">${item.subtitle}</p>
          </div>
        `;
        row.addEventListener('click', () => {
          dropdown.classList.add('hidden');
          onSelect(item.lat, item.lon, item.title);
        });
        dropdown.appendChild(row);
      });
      dropdown.classList.remove('hidden');
    }

    // Geolocation Handler
    function triggerGeolocation() {
      if (!navigator.geolocation) {
        alert("Tarayıcınız canlı konum servisini desteklemiyor.");
        return;
      }
      const btn = document.getElementById('locateMeBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span class="w-3 h-3 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></span> Konum alınıyor...`;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          btn.innerHTML = originalText;
          selectOrigin(pos.coords.latitude, pos.coords.longitude, "Mevcut Konumum (Canlı GPS)");
          document.getElementById('toInput').focus();
        },
        (err) => {
          btn.innerHTML = originalText;
          alert("Konum alınamadı: " + err.message + ". Lütfen tarayıcı konum iznini onaylayın.");
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    document.getElementById('locateMeBtn').addEventListener('click', triggerGeolocation);
    document.getElementById('fromLocateBtn').addEventListener('click', triggerGeolocation);

    // Strategy Pills Handler
    document.querySelectorAll('.target-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.target-pill').forEach(p => {
          p.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-400', 'shadow-sm');
          p.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700/80');
        });
        pill.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700/80');
        pill.classList.add('bg-cyan-600', 'text-white', 'border-cyan-400', 'shadow-sm');
        currentTarget = pill.dataset.target;
        if (selectedFrom && selectedTo) executeRouteSearch();
      });
    });

    // Mode chips toggle
    document.querySelectorAll('.mode-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const mode = chip.getAttribute('data-mode');
        if (preferredModes.has(mode)) {
          preferredModes.delete(mode);
          chip.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-400');
          chip.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
        } else {
          preferredModes.add(mode);
          chip.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
          chip.classList.add('bg-cyan-600', 'text-white', 'border-cyan-400');
        }
        if (selectedFrom && selectedTo) executeRouteSearch();
      });
    });

    // Minibus Toggle
    document.getElementById('minibusToggle').addEventListener('change', () => {
      if (selectedFrom && selectedTo) executeRouteSearch();
    });

    // Swap button
    document.getElementById('swapBtn').addEventListener('click', () => {
      if (!selectedFrom && !selectedTo) return;
      const temp = selectedFrom;
      selectedFrom = selectedTo;
      selectedTo = temp;

      if (selectedFrom) selectOrigin(selectedFrom.lat, selectedFrom.lon, selectedFrom.name);
      else clearOrigin();

      if (selectedTo) selectDestination(selectedTo.lat, selectedTo.lon, selectedTo.name);
      else clearDestination();

      if (selectedFrom && selectedTo) executeRouteSearch();
    });

    document.getElementById('clearFromBtn').addEventListener('click', clearOrigin);
    document.getElementById('clearToBtn').addEventListener('click', clearDestination);

    // Quick chips
    document.querySelectorAll('.quick-chip').forEach(chip => {
      chip.addEventListener('click', async () => {
        const fromName = chip.getAttribute('data-from');
        const toName = chip.getAttribute('data-to');
        const rFrom = await fetch(`/api/search?q=${encodeURIComponent(fromName)}`).then(r => r.json());
        const rTo = await fetch(`/api/search?q=${encodeURIComponent(toName)}`).then(r => r.json());
        if (rFrom.results && rFrom.results.length > 0) {
          selectOrigin(rFrom.results[0].lat, rFrom.results[0].lon, rFrom.results[0].title);
        }
        if (rTo.results && rTo.results.length > 0) {
          selectDestination(rTo.results[0].lat, rTo.results[0].lon, rTo.results[0].title);
        }
      });
    });

    document.getElementById('searchBtn').addEventListener('click', async () => {
      // Auto-resolve typed text if user didn't click dropdown option
      const fromVal = document.getElementById('fromInput').value.trim();
      const toVal = document.getElementById('toInput').value.trim();

      if (!selectedFrom && fromVal) {
        try {
          const rFrom = await fetch(`/api/search?q=${encodeURIComponent(fromVal)}`).then(r => r.json());
          if (rFrom.results && rFrom.results.length > 0) {
            selectOrigin(rFrom.results[0].lat, rFrom.results[0].lon, rFrom.results[0].title);
          }
        } catch (e) {}
      }
      if (!selectedTo && toVal) {
        try {
          const rTo = await fetch(`/api/search?q=${encodeURIComponent(toVal)}`).then(r => r.json());
          if (rTo.results && rTo.results.length > 0) {
            selectDestination(rTo.results[0].lat, rTo.results[0].lon, rTo.results[0].title);
          }
        } catch (e) {}
      }
      executeRouteSearch();
    });

    // Route Search Execution
    async function executeRouteSearch() {
      if (!selectedFrom || !selectedTo) {
        alert("Lütfen başlangıç ve varış noktalarını belirleyin!");
        return;
      }

      const resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = `
        <div class="h-64 flex flex-col items-center justify-center text-slate-400 gap-3">
          <div class="w-10 h-10 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
          <div class="text-center space-y-1">
            <p class="text-sm font-semibold text-slate-200">En uygun rotalar hesaplanıyor...</p>
            <p class="text-xs text-slate-400">RAPTOR matrisi taranıyor & İETT canlı GPS telemetrisi çekiliyor</p>
          </div>
        </div>
      `;

      clearRouteMap();

      const allowMinibus = document.getElementById('minibusToggle').checked;
      let dateStr = null;
      let timeStr = null;

      if (currentTimeType !== 'DEPART_NOW') {
        const rawDate = document.getElementById('journeyDate').value;
        const rawTime = document.getElementById('journeyTime').value;
        if (rawDate && rawTime) {
          dateStr = rawDate;
          timeStr = rawTime.length === 5 ? rawTime + ':00' : rawTime;
        }
      }

      const payload = {
        from_lat: selectedFrom.lat,
        from_lon: selectedFrom.lon,
        to_lat: selectedTo.lat,
        to_lon: selectedTo.lon,
        prefer_modes: Array.from(preferredModes),
        allow_minibus: allowMinibus,
        target: currentTarget,
        time_type: currentTimeType,
        date_str: dateStr,
        time_str: timeStr,
        num_itineraries: 4
      };

      try {
        const res = await fetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        renderResults(data);
      } catch (e) {
        resultsArea.innerHTML = `
          <div class="p-4 bg-rose-950/80 border border-rose-800 text-rose-200 rounded-xl text-xs space-y-1">
            <p class="font-bold">Rota Bulunamadı veya Sunucu Hatası</p>
            <p>${e.message}</p>
          </div>
        `;
      }
    }

    // Render Itinerary Cards and Polyline on Leaflet
    function renderResults(data) {
      const resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = '';

      if (!data.itineraries || data.itineraries.length === 0) {

            <p class="font-bold text-slate-200 text-sm">Uygun rota bulunamadı</p>
            <p class="text-slate-400">Filtreleri gevşetmeyi veya minibüs seçeneğini açmayı deneyebilirsiniz.</p>
          </div>
        `;
        return;
      }

      data.itineraries.forEach((itin, index) => {

                <div class="flex items-center justify-between font-bold">
                  <span class="flex items-center gap-1.5">

                  <span>⚡</span> <span>Trafikten İzole Koridor</span>
                </div>
              `;

          stepsHtml += `
            <div class="relative pl-5 pb-3 border-l-2 last:border-l-0 last:pb-0" style="border-color: ${theme.color}66">
              <span class="absolute -left-[10px] top-0 w-5 h-5 rounded-full bg-slate-900 border flex items-center justify-center text-[10px] shadow" style="border-color: ${theme.color}">

                  <span>ℹ️</span> <span>${leg.alternative_lines_notice}</span>
                </div>
              ` : (leg.route_short_name ? `
                <p class="text-[11px] text-slate-400 truncate mt-0.5">${leg.route_long_name || leg.agency_name || ''}</p>
              ` : '')}
              ${intermediateHtml}
              ${trafficBadge}
              ${realtimeBadge}
            </div>
          `;
        });

        // Fare, Eco and Traffic summary
        const fare = itin.fare || { standard_tl: 0, student_tl: 0 };
        const co2 = itin.co2_saved_kg || 0;
        const trafficDelay = itin.traffic_delay_minutes || 0;

        card.innerHTML = `
          ${itin.is_scenic_detour ? `
            <div class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-sky-950/90 to-cyan-950/90 border border-sky-500/70 text-sky-200 text-xs flex items-center justify-between shadow-md">
              <span class="font-bold flex items-center gap-1.5">${itin.scenic_badge || '🌊 Boğaz & Vapur Deneyimi'}</span>
              <span class="text-[10px] font-semibold text-sky-300 px-2 py-0.5 rounded-full bg-sky-900/60">Özel Deniz Rotası</span>
            </div>
            ${itin.scenic_description ? `<p class="text-[11px] text-sky-300/90 italic pl-1">${itin.scenic_description}</p>` : ''}

          <div class="flex items-center justify-between">
            <div class="flex items-baseline gap-2">
              <span class="text-3xl font-black text-cyan-400 tracking-tight">${itin.total_duration_minutes} <span class="text-xs font-semibold text-slate-400">dk</span></span>
              
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${itin.transfers === 0 ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-300 border border-slate-700'}">

              <p class="font-medium text-slate-200">💳 ~${fare.standard_tl} TL <span class="text-slate-400">(${fare.student_tl} TL Öğr.)</span></p>

        card.addEventListener('click', () => {
          document.querySelectorAll('.itinerary-card, .glass-card').forEach(c => c.classList.remove('active-card'));
          card.classList.add('active-card');
          drawRouteOnMap(itin);

        resultsArea.appendChild(card);
      });

      drawRouteOnMap(data.itineraries[0]);
    }

    // Draw Polylines and Intermediate Station Circles
    function drawRouteOnMap(itin) {
      clearRouteMap();
      let allCoords = [];

      itin.legs.forEach(leg => {
        let coords = [];
        if (leg.polyline) {
          coords = decodePolyline(leg.polyline, 5);
        } else if (leg.from_coords && leg.to_coords && leg.from_coords.lat && leg.to_coords.lat) {
          coords = [[leg.from_coords.lat, leg.from_coords.lon], [leg.to_coords.lat, leg.to_coords.lon]];
        }

        if (coords.length > 0) {
          allCoords = allCoords.concat(coords);
          const theme = getTransitTheme(leg);

          // 1. Underlay Shadow Line for visual depth
          if (!theme.isWalk) {
            const shadowLine = L.polyline(coords, {
              color: 'rgba(15, 23, 42, 0.35)',
              weight: 9,
              lineCap: 'round',
              lineJoin: 'round',
              opacity: 0.6
            }).addTo(map);
            activeRouteLayers.push(shadowLine);
          }

          // 2. Main Transit Polyline
          const mainLine = L.polyline(coords, {
            color: theme.color,
            weight: theme.isWalk ? 4 : 5.5,
            opacity: 0.95,
            dashArray: theme.isWalk ? '6, 8' : null,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);
          activeRouteLayers.push(mainLine);

          // 3. Add station badge for boarding stop
          if (!theme.isWalk && leg.from_coords && leg.from_coords.lat) {
            const stopPin = L.marker([leg.from_coords.lat, leg.from_coords.lon], {
              icon: L.divIcon({
                className: 'transfer-station-pin',
                html: `<div style="--st-color: ${theme.color}; width:22px; height:22px; border-radius:50%; background:#ffffff; border:2.5px solid ${theme.color}; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.35); font-size:10px;">${theme.icon}</div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
              })
            }).addTo(map).bindPopup(`
              <div class="text-xs font-bold text-white">${leg.from_stop}</div>
              <div class="text-[11px] font-semibold text-cyan-300 mt-0.5">${theme.icon} ${leg.route_short_name || theme.name}</div>
              ${leg.departure_time ? `<div class="text-[10px] text-slate-400 mt-0.5">Kalkış: ${leg.departure_time}</div>` : ''}
            `);
            activeRouteLayers.push(stopPin);
          }

          // 4. Add dots for intermediate stops along the line
          if (leg.intermediate_stops) {
            leg.intermediate_stops.forEach(s => {
              if (s.lat && s.lon) {
                const dot = L.circleMarker([s.lat, s.lon], {
                  radius: 3.5,
                  fillColor: theme.color,
                  color: '#ffffff',
                  weight: 1.5,
                  opacity: 1,
                  fillOpacity: 1
                }).addTo(map).bindPopup(`
                  <div class="text-xs font-semibold text-white">${s.name}</div>
                  <div class="text-[10px] text-slate-400">${leg.route_short_name || theme.name}</div>
                `);
                activeRouteLayers.push(dot);
              }
            });
          }
        }

        // 5. Live IETT Bus Radar Marker
        if (leg.realtime && leg.realtime.target_vehicle_lat && leg.realtime.target_vehicle_lon) {
          const busMarker = L.marker([leg.realtime.target_vehicle_lat, leg.realtime.target_vehicle_lon], {
            icon: L.divIcon({
              className: 'live-bus-pin',
              html: `
                <span class="pulse-dot" style="background:#10b981; width:7px; height:7px;"></span>
                <span>🚌 ${leg.realtime.target_vehicle}</span>
              `,
              iconSize: [85, 26],
              iconAnchor: [42, 13]
            })
          }).addTo(map).bindPopup(`
            <div class="text-xs font-bold text-amber-300 flex items-center gap-1.5">
              <span class="pulse-dot" style="background:#10b981; width:6px; height:6px;"></span>
              CANLI İETT ARAÇ RADARI
            </div>
            <div class="text-xs text-white mt-1 font-semibold">Araç: ${leg.realtime.target_vehicle}</div>
            <div class="text-[11px] text-slate-300 mt-0.5">${leg.realtime.message}</div>
          `);
          busMarkers.push(busMarker);
        }
      });

      if (allCoords.length > 0) {
        map.fitBounds(allCoords, { padding: [50, 50] });
      }
    }

    // Datetime Picker Setup
    function initTemporalPicker() {
      const pickerArea = document.getElementById('temporalPickerArea');
      const label = document.getElementById('temporalLabel');
      const dateInput = document.getElementById('journeyDate');
      const timeInput = document.getElementById('journeyTime');
      const resetBtn = document.getElementById('resetNowBtn');
      const toggleCustomBtn = document.getElementById('toggleCustomTimeBtn');

      function formatYMD(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function formatHM(d) {
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }

      function setNowDefaults() {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 5);
        dateInput.value = formatYMD(now);
        timeInput.value = formatHM(now);
      }

      setNowDefaults();

      toggleCustomBtn.addEventListener('click', () => {
        pickerArea.classList.toggle('hidden');
      });

      resetBtn.addEventListener('click', () => {
        currentTimeType = 'DEPART_NOW';
        pickerArea.classList.add('hidden');
        setNowDefaults();
        
        document.querySelectorAll('.time-quick-chip').forEach(c => {
          c.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-500');
          c.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
        });
        const nowChip = document.querySelector('.time-quick-chip[data-type="DEPART_NOW"]');
        if (nowChip) {
          nowChip.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
          nowChip.classList.add('bg-cyan-600', 'text-white', 'border-cyan-500');
        }

        if (selectedFrom && selectedTo) executeRouteSearch();
      });

      dateInput.addEventListener('change', () => {
        currentTimeType = 'DEPART_AT';
        document.querySelectorAll('.time-quick-chip').forEach(c => {
          c.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-500');
          c.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
        });
        if (selectedFrom && selectedTo) executeRouteSearch();
      });

      timeInput.addEventListener('change', () => {
        currentTimeType = 'DEPART_AT';
        document.querySelectorAll('.time-quick-chip').forEach(c => {
          c.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-500');
          c.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
        });
        if (selectedFrom && selectedTo) executeRouteSearch();
      });

      // Quick time preset chips ('Şimdi', 'Bugün 18:00', 'Gece 01:00', 'Yarın 08:30')
      document.querySelectorAll('.time-quick-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.time-quick-chip').forEach(c => {
            c.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-500');
            c.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
          });
          chip.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');
          chip.classList.add('bg-cyan-600', 'text-white', 'border-cyan-500');

          const tType = chip.dataset.type;
          currentTimeType = tType;

          if (tType === 'DEPART_NOW') {
            pickerArea.classList.add('hidden');
            setNowDefaults();
          } else {
            const days = parseInt(chip.dataset.days || '0', 10);
            const tStr = chip.dataset.time || '18:00';
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + days);
            dateInput.value = formatYMD(targetDate);
            timeInput.value = tStr;
            pickerArea.classList.remove('hidden');
          }

          if (selectedFrom && selectedTo) executeRouteSearch();
        });
      });
    }

    // Startup Initialization
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupAutocomplete('fromInput', 'fromDropdown', selectOrigin);
      setupAutocomplete('toInput', 'toDropdown', selectDestination);
      initTemporalPicker();

      // Mobile drawer & handle toggle
      const sidebar = document.getElementById('sidebar');
      const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
      const sheetHandle = document.getElementById('sheetHandle');

      if (toggleSidebarBtn) {
        toggleSidebarBtn.addEventListener('click', () => {
          sidebar.classList.toggle('collapsed');
          if (map) map.invalidateSize();
        });
      }

      if (sheetHandle) {
        sheetHandle.addEventListener('click', () => {
          sidebar.classList.toggle('collapsed');
          if (map) map.invalidateSize();
        });
      }
    });
  </script>
</body>
</html>
